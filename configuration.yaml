# Text to speech
tts:
  - platform: google_translate

media_player:
  - platform: yamaha
    host: 192.168.2.195

wake_on_lan:

readme:

switch:
  - platform: wake_on_lan
    mac: 30:85:a9:94:57:7b
    host: "192.168.2.2"
    name: WOL M3te0r PC
    turn_off:
      service: script.shutdown_pc_m3te0r
  - platform: wake_on_lan
    mac: 00:a0:de:de:2e:a8
    name: WOL Yamaha R-N500
  - platform: wake_on_lan
    mac: b4:22:00:72:d3:57
    name: WOL Imprimante
  - platform: wake_on_lan
    mac: a4:4c:c8:73:56:7a
    name: WOL Marie Laptop
  - platform: wake_on_lan
    mac: 8c:8c:aa:74:df:f0
    name: WOL Thinkpad Mathieu
  - platform: wake_on_lan
    mac: 00:11:32:8c:51:87
    name: WOL DS1618+ NAS

sensor:
  - platform: template
    sensors:
      outside_temperature:
        friendly_name: "outside_temperature"
        unit_of_measurement: "°C"
        value_template: "{{ state_attr('weather.bordeaux', 'temperature') }}"
  - platform: time_date
    display_options:
      - "time"
      - "date"
      - "date_time"
      - "date_time_utc"
      - "date_time_iso"
      - "time_date"
      - "time_utc"

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 192.168.2.6

bluetooth:

powercalc:

notify:
  - name: "Notification Free Mobile Mathieu"
    platform: free_mobile
    username: !secret FREE_MOBILE_ACCOUNT_ID
    access_token: !secret FREE_MOBILE_TOKEN

keyboard_remote:
  - device_descriptor: "/dev/input/event3"
    type: "key_down"
    emulate_key_hold: true
    emulate_key_hold_delay: 0.25
    emulate_key_hold_repeat: 2.0

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
